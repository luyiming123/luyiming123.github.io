# 推送到 main 分支后自动构建 Hugo 站点并发布到 GitHub Pages
# 无需任何 Secrets，Pages 的权限由下方 permissions 提供
name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 GITHUB_TOKEN 部署到 Pages，并读取仓库内容
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；排队中的旧任务会被取消
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 与本地预览所用版本保持一致（主题 PaperMod 要求 >= 0.146.0）
      HUGO_VERSION: 0.165.0
      HUGO_ENVIRONMENT: production
    steps:
      - name: 检出仓库（含主题）
        uses: actions/checkout@v4
        with:
          submodules: recursive   # 若改用 git submodule 管理主题，这里必须为 true
          fetch-depth: 0          # 便于 .Lastmod / .GitInfo 使用

      - name: 安装 Hugo extended
        run: |
          wget -q -O hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          sudo tar -xf hugo.tar.gz -C /usr/local/bin hugo
          hugo version

      - name: 配置 GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: 构建站点
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
